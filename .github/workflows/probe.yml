name: Sonde (temporaire)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          curl -sS -L -A "Mozilla/5.0 (compatible; elections-israel-2026/1.0; +https://souweyd.github.io/elections-israel-2026/)" \
            -D probe/petek.headers -o probe/petek.html https://www.thepetek.com/results || true
          ls -la probe
          git config user.name "collecte-automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Sonde : page de résultats The Petek" && git push || true
