name: Sonde (temporaire)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="Mozilla/5.0 (compatible; elections-israel-2026/1.0; +https://souweyd.github.io/elections-israel-2026/)"
          curl -sS -L -A "$UA" -o probe/board.html https://www.thepetek.com/results/board || true
          curl -sS -L -A "$UA" -o probe/fr.html https://www.thepetek.com/fr/results || true
          git config user.name "collecte-automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin main || true
          git add probe && git commit -m "Sonde : pages The Petek" && git push origin HEAD:main || true
