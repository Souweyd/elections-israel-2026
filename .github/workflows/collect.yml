name: Collecte des résultats (CEC)

on:
  schedule:
    - cron: "*/15 * * * *"  # toutes les 15 minutes (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}      # lancement manuel : onglet Actions → Run workflow
  push:                      # passage immédiat à chaque mise à jour du site (hors données)
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lire le fichier officiel de la CEC
        run: node scripts/collect.mjs
      - name: Publier si les données ont changé
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "collecte-automatique"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Relevé CEC $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Aucun changement à publier."
          fi
